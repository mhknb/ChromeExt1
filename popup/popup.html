<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Content Exporter</h1>
      <p class="subtitle">Clean Copy & Multi-Format Export</p>
    </header>

    <div class="platform-status">
      <div class="platform-indicator">
        <span class="status-dot" id="platformDot"></span>
        <span id="platformName">Platform tespit ediliyor...</span>
      </div>
    </div>

    <section class="features">
      <h2>Hızlı İşlemler</h2>

      <div class="action-group">
        <button id="cleanCopyBtn" class="action-btn primary" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Temiz Metin Kopyala
          <span class="description">Markdown işaretleri olmadan</span>
        </button>

        <button id="exportTxtBtn" class="action-btn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="10" y1="14" x2="14" y2="14"></line>
            <line x1="10" y1="18" x2="14" y2="18"></line>
          </svg>
          TXT İndir
          <span class="description">Temiz metin dosyası (her yerde açılır)</span>
        </button>

        <button id="exportDocxBtn" class="action-btn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          RTF İndir
          <span class="description">Word formatı (sorunsuz açılır)</span>
        </button>

        <button id="exportPdfBtn" class="action-btn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          PDF İndir
          <span class="description">Taşınabilir format</span>
        </button>
      </div>
    </section>

    <section class="options">
      <h3>Ayarlar</h3>
      <label class="checkbox-label">
        <input type="checkbox" id="preserveCodeBlocks" checked>
        <span>Kod bloklarını koru (syntax highlighting)</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="preserveTables" checked>
        <span>Tablo formatını koru</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="removeEmojis">
        <span>Emoji'leri kaldır</span>
      </label>
    </section>

    <div class="status-message" id="statusMessage"></div>

    <footer>
      <p class="supported-platforms">
        Desteklenen platformlar: ChatGPT, Claude, Gemini, DeepSeek
      </p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
